name: Service tests
description: Lint and typecheck the whole repo, then run a service's unit tests together with the unit tests of every package

inputs:
  workspace:
    description: Workspace name of the service, for example @linky-fit/site
    required: true

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.9

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # check-code fixes what it can, so a diff means the code was not lint-clean.
    - name: Typecheck, lint and format
      shell: bash
      run: bun run check-code && git diff --exit-code

    - name: Test ${{ inputs.workspace }} and packages
      shell: bash
      run: bun run --filter "$WORKSPACE" --filter './packages/*' test
      env:
        WORKSPACE: ${{ inputs.workspace }}
