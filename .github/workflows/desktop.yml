name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop.yml

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the DMG
        run: bun run desktop:mac

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: linky-mac-arm64
          path: apps/desktop/release/linky-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 7
