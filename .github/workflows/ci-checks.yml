name: CI · checks

# Runs on pull requests, on every push to main (the site and the error tracker
# gate production on `lint` and `unit-tests`) and as part of every release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # check-code fixes what it can, so a diff means the code was not lint-clean.
      - name: Typecheck, lint and format
        run: bun run check-code && git diff --exit-code

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  linkshu-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local mints
        run: docker compose -f docker-compose.dev.yml up -d --wait cashu-mint cashu-mint-target

      - name: Run linkshu integration tests
        run: bun run --filter @linky-fit/linkshu test:integration

      - name: Dump mint logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs cashu-mint cashu-mint-target

  npm-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate the shared package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/linkshu/package.json').version")
          test "$version" = "$(node -p "require('./packages/linkstr/package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a shared stable package version such as 0.1.0"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web-app
        run: bunx playwright install --with-deps chromium

      - name: Verify npm tarballs in an isolated consumer
        run: bun run check:npm

      # release-npm.yml publishes exactly these tarballs.
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
