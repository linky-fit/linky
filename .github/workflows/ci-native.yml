name: CI · native

# Builds the apps/expo iOS and Android projects to catch native build breaks.
# Manual only: pull requests only Hermes-compile the bundles (`expo-native-bundle`
# in ci.yml). Nothing here is signed for distribution.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Android release (local QA signing)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Gradle's bundle step runs Metro under node.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Android project
        working-directory: apps/expo
        run: bun run native:prebuild --platform android

      # Without LINKY_UPLOAD_* the release signs with this keystore, which prebuild generates.
      - name: Build the release APK
        working-directory: apps/expo/android
        env:
          LINKY_ANDROID_DEBUG_KEYSTORE: ${{ github.workspace }}/apps/expo/android/app/debug.keystore
        run: ./gradlew :app:assembleRelease

      - name: Upload the QA APK
        uses: actions/upload-artifact@v7
        with:
          name: linky-expo-android-qa-apk
          path: apps/expo/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator-release:
    name: iOS simulator release (unsigned)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Xcode's bundle phase runs Metro under node.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the iOS project
        working-directory: apps/expo
        run: bun run native:prebuild --platform ios

      - name: Build for the simulator
        working-directory: apps/expo/ios
        run: >-
          xcodebuild -workspace LinkyExpoDev.xcworkspace -scheme LinkyExpoDev
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
