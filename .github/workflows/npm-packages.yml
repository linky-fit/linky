name: npm packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ["packages-v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate shared package version and release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/linkshu/package.json').version")
          test "$version" = "$(node -p "require('./packages/linkstr/package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a shared stable package version such as 0.1.0"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$RELEASE_TAG" = "packages-v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run check-code
      - run: bun run test
      - name: Install Chromium
        working-directory: apps/web-app
        run: bunx playwright install --with-deps chromium
      - name: Verify npm tarballs in an isolated consumer
        run: bun run check:npm
      - name: Start local mints
        run: docker compose -f docker-compose.dev.yml up -d --wait cashu-mint cashu-mint-target
      - run: bun run --filter @linky-fit/linkshu test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [linkshu, linkstr]
    concurrency:
      group: npm-publish-${{ matrix.package }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
      - name: Publish the tested tarball from main history
        env:
          PACKAGE: ${{ matrix.package }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          npm publish "dist/npm/linky-fit-$PACKAGE-$RELEASE_VERSION.tgz" --access public --ignore-scripts
