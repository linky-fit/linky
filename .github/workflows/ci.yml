name: CI

# Every check runs here, once per commit. Releases start when this workflow
# succeeds on main or a hotfix/** branch and ship the commit it tested; the site
# and the error tracker gate production on its checks through Vercel.
on:
  push:
    branches:
      - main
      - "hotfix/**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # check-code fixes what it can, so a diff means the code was not lint-clean.
      - name: Typecheck, lint and format
        run: bun run check-code && git diff --exit-code

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  linkshu-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local mints
        run: docker compose -f docker-compose.dev.yml up -d --wait cashu-mint cashu-mint-target

      - name: Run linkshu integration tests
        run: bun run --filter @linky-fit/linkshu test:integration

      - name: Dump mint logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs cashu-mint cashu-mint-target

  npm-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validate the shared package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/linkshu/package.json').version")
          test "$version" = "$(node -p "require('./packages/linkstr/package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a shared stable package version such as 0.1.0"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web-app
        run: bunx playwright install --with-deps chromium

      - name: Verify npm tarballs in an isolated consumer
        run: bun run check:npm

      # release-npm.yml publishes exactly these tarballs.
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error

  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL so the raw buildx
      # invocation below can use the type=gha cache backend.
      - name: Expose Actions cache env to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      # Image pulls and builds are the long pole (~75s cold), so they run in the
      # background while Bun and Playwright set up; "Start local stack" joins on
      # the status file. Distinct cache scopes keep the two images from
      # overwriting each other's GHA cache index.
      - name: Prepare stack images (background)
        run: |
          {
            docker compose -f docker-compose.dev.yml pull -q nostr-relay cashu-mint &
            pull=$!
            docker buildx bake -f docker-compose.dev.yml \
              --set 'evolu-relay.cache-from=type=gha,scope=evolu-relay' \
              --set 'evolu-relay.cache-to=type=gha,scope=evolu-relay,mode=max' \
              --set 'web-app.cache-from=type=gha,scope=web-app' \
              --set 'web-app.cache-to=type=gha,scope=web-app,mode=max' \
              --load &
            bake=$!
            status=0
            wait "$pull" || status=$?
            wait "$bake" || status=$?
            echo "$status" > /tmp/prepare-images.status
          } &> /tmp/prepare-images.log &

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Previously ran inside the web-app image build; here it overlaps the
      # background image prep while still failing the `app-e2e` check that gates
      # releases.
      - name: Typecheck web app
        run: bun run --filter @linky-fit/web-app typecheck

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: apps/web-app
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # --only-shell: the config runs headless-only, so the full Chromium
      # download is unnecessary.
      - name: Install Playwright browsers
        working-directory: apps/web-app
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Start local stack
        run: |
          while [ ! -f /tmp/prepare-images.status ]; do sleep 2; done
          cat /tmp/prepare-images.log
          [ "$(cat /tmp/prepare-images.status)" -eq 0 ]
          docker compose -f docker-compose.dev.yml --profile e2e up -d --wait --no-build

      - name: Verify Evolu relay quota and log privacy
        run: docker run --rm -v "$PWD/docker/evolu-relay/relay.test.js:/app/relay.test.js:ro" linky-evolu-relay npm test

      - name: Run e2e tests
        working-directory: apps/web-app
        run: bunx playwright test --project=local-stack

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml --profile e2e logs

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-test-results
          path: apps/web-app/test-results/
          retention-days: 7

  site-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start relay and mints
        run: docker compose -f docker-compose.dev.yml --profile e2e up -d --wait nostr-relay cashu-mint cashu-mint-target

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: apps/site
        run: echo "version=$(bunx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        working-directory: apps/site
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Run site e2e tests
        run: bun run --filter @linky-fit/site test:e2e

      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml --profile e2e logs nostr-relay cashu-mint cashu-mint-target

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-e2e-test-results
          path: apps/site/test-results/
          retention-days: 7
