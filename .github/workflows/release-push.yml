name: Release · push

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-push
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run service tests
        uses: ./.github/actions/service-tests
        with:
          workspace: "@linky-fit/push"

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/linky-fit/linky-push
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/push/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to push.linky.fit
        uses: appleboy/ssh-action@v1
        with:
          host: push.linky.fit
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/stack
            test "$(docker compose config --images push)" = "ghcr.io/linky-fit/linky-push:latest"
            docker compose pull push
            expected_commit=$(echo "${{ github.sha }}" | cut -c1-12)
            pulled_commit=$(docker image inspect ghcr.io/linky-fit/linky-push:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | cut -c1-12)
            test "$pulled_commit" = "$expected_commit"
            docker compose up -d --no-deps push
            curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-all-errors https://push.linky.fit/health
            actual_commit=$(curl --fail --silent --show-error --max-time 10 https://push.linky.fit/)
            test "$actual_commit" = "$expected_commit"
            echo "Deployed push commit $actual_commit"
