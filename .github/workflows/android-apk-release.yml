name: Android APK Release

# A release normally starts from the version-bump push to main; that run creates
# the v<version> tag through `gh release create`, and tags created with the
# workflow token do not trigger workflows again. The tag trigger covers manually
# pushed tags; when such a tag already exists, the branch push skips so only one
# run publishes a given version.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag / release name (for example v26.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      publish: ${{ steps.metadata.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: metadata
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_RELEASE_TAG"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(jq -r .version package.json)"
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
              echo "Tag $release_tag already exists; the tag push owns this release."
              publish=false
            fi
          fi

          if [[ -z "$release_tag" || "$release_tag" == "v" ]]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [resolve, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      APK_PATH: apps/native-shell/android/app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release paths
        run: |
          echo "APK_UPLOAD_PATH=$RUNNER_TEMP/linky.apk" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: apps/native-shell/scripts/extract-release-notes.sh "$RELEASE_TAG" "$RELEASE_NOTES_PATH"

      - name: Restore Android release secrets
        uses: ./.github/actions/android-release-setup
        with:
          google-services-json-base64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          upload-store-password: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          upload-key-alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          upload-key-password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Run checks
        run: bun run check-code

      - name: Build Android release APK
        run: bun run native:apk:release

      - name: Prepare APK asset
        run: cp "$APK_PATH" "$APK_UPLOAD_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            gh release upload "$RELEASE_TAG" "$APK_UPLOAD_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_UPLOAD_PATH" \
              --title "Linky $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --target "$GITHUB_SHA"
          fi

  zapstore:
    name: Publish to Zapstore
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zapstore
    permissions:
      contents: read
    env:
      ZSP_VERSION: 0.4.14
      ZSP_LINUX_AMD64_SHA256: f655a6c253a0aff6c6768dd24c65fb12aafe9cd2e48d35605e623adf54aaddb2

    steps:
      - name: Checkout Zapstore metadata
        uses: actions/checkout@v5

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: apps/native-shell/android/app/build/outputs/apk/release

      - name: Install verified Zapstore publisher
        run: |
          zsp_path="$RUNNER_TEMP/zsp"
          curl --fail --location --silent --show-error \
            --output "$zsp_path" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "${ZSP_LINUX_AMD64_SHA256}  ${zsp_path}" | sha256sum --check --status
          chmod 700 "$zsp_path"

      - name: Publish signed APK to Zapstore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          if [[ "${SIGN_WITH}" != nsec1* ]]; then
            echo "Missing or invalid ZAPSTORE_NSEC environment secret" >&2
            exit 1
          fi

          "$RUNNER_TEMP/zsp" publish zapstore.yaml \
            --quiet \
            --skip-preview \
            --commit "$GITHUB_SHA"
