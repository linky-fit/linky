name: Release · linky

# Starts when CI succeeds on a push to main or a hotfix/** branch, and ships the
# commit CI tested once the version in apps/linky-app/package.json has no
# linky-v tag yet: `publish` creates the tag and GitHub release, and the app
# ships by moving the `linky-production` branch, which Vercel deploys to
# app.linky.fit. A manual run started from a linky-v tag republishes that tag.
# workflow_run jobs run in main's context, so every checkout names the release
# commit explicitly.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - "hotfix/**"
  workflow_dispatch:

jobs:
  resolve:
    # Pushes only: a pull request from a fork can name its branch hotfix/**.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      release_tag: ${{ steps.release.outputs.release-tag }}
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}

    steps:
      # The workflow's own commit, which carries require-ci even when an older
      # hotfix commit does not.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve the release
        id: release
        uses: ./.github/actions/resolve-release
        with:
          manifest: apps/linky-app/package.json
          tag-prefix: linky-v

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Every push to main starts this workflow, so only real releases queue here
    # and a no-op run can't replace a pending one.
    concurrency:
      group: release-linky
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      APK_PATH: apps/native-shell/android/app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release paths
        run: |
          echo "APK_UPLOAD_PATH=$RUNNER_TEMP/linky.apk" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          echo "LIVE_UPDATE_DIR=$RUNNER_TEMP/live-update" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: apps/native-shell/scripts/extract-release-notes.sh "$RELEASE_TAG" "$RELEASE_NOTES_PATH"

      - name: Restore Android release secrets
        uses: ./.github/actions/android-release-setup
        with:
          google-services-json-base64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          upload-store-password: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          upload-key-alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          upload-key-password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Build Android release APK
        env:
          VITE_ONCHAIN_OPERATOR_NPUB: ${{ vars.ONCHAIN_OPERATOR_NPUB }}
        run: bun run native:apk:release

      - name: Build Android App Bundle
        working-directory: apps/native-shell/android
        run: bash ../scripts/with-java17.sh ./gradlew bundleRelease

      # Shells built from the same native code pick this web bundle up
      # without a store update; see apps/native-shell/README.md.
      - name: Pack the live update
        env:
          LIVE_UPDATE_SIGNING_KEY: ${{ secrets.LIVE_UPDATE_SIGNING_KEY }}
        run: bun apps/native-shell/scripts/publish-live-update.ts "$RELEASE_TAG" "$LIVE_UPDATE_DIR"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: apps/native-shell/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare APK asset
        run: cp "$APK_PATH" "$APK_UPLOAD_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            gh release upload "$RELEASE_TAG" "$APK_UPLOAD_PATH" "$LIVE_UPDATE_DIR"/* --clobber
          else
            # Installed shells and the desktop app update from the latest release.
            gh release create "$RELEASE_TAG" "$APK_UPLOAD_PATH" "$LIVE_UPDATE_DIR"/* \
              --title "Linky ${RELEASE_TAG#linky-}" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --target "$RELEASE_SHA" \
              --latest
          fi

  web-production:
    name: Ship the linky app to production
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    # Holds the release app's credentials and admits only main and linky-v* tags.
    environment: Production
    # Releases publish one at a time, so production moves in release order.
    concurrency:
      group: linky-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      # The linky-production ruleset lets only this app push; GITHUB_TOKEN can't bypass rulesets.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          token: ${{ steps.app-token.outputs.token }}

      # Forced, because a hotfix tag cut outside main is not an ancestor of the
      # next release.
      - name: Move the linky-production branch to the release
        run: git push --force origin HEAD:refs/heads/linky-production

  google-play:
    name: Publish to Google Play open testing
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: android-google-play-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download signed AAB
        uses: actions/download-artifact@v8
        with:
          name: android-release-aab
          path: google-play

      - name: Prepare localized release notes
        run: |
          whats_new_dir="$RUNNER_TEMP/google-play-whats-new"
          apps/native-shell/scripts/extract-release-notes.sh \
            "$RELEASE_TAG" "$whats_new_dir/whatsnew-cs-CZ" cs-CZ
          apps/native-shell/scripts/extract-release-notes.sh \
            "$RELEASE_TAG" "$whats_new_dir/whatsnew-en-US" en-US

      - name: Upload to Google Play internal and open testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fit.linky.app
          releaseFiles: google-play/app-release.aab
          tracks: internal,beta
          status: completed
          changesNotSentForReview: false
          whatsNewDirectory: ${{ runner.temp }}/google-play-whats-new

  macos:
    name: Publish macOS beta
    needs: [resolve, publish]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the DMG
        run: bun run desktop:mac

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" apps/desktop/release/linky-mac-arm64.dmg --clobber

  zapstore-screenshots:
    name: Render Zapstore screenshots
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/linky-site
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Render screenshots
        run: bun run zapstore:screenshots

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: zapstore-screenshots
          path: apps/linky-site/zapstore-screenshots
          if-no-files-found: error
          retention-days: 1

  zapstore:
    name: Publish to Zapstore
    needs: [resolve, publish, zapstore-screenshots]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zapstore
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      ZSP_VERSION: 2.0.0
      ZSP_LINUX_AMD64_SHA256: 5483806beafde1b5deaa16f5efbead35a211b7d6015752f86d099e0faecc4a66

    steps:
      - name: Checkout Zapstore metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: apps/native-shell/android/app/build/outputs/apk/release

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: zapstore-screenshots
          path: apps/linky-site/zapstore-screenshots

      - name: Install verified Zapstore publisher
        run: |
          zsp_path="$RUNNER_TEMP/zsp"
          curl --fail --location --silent --show-error \
            --output "$zsp_path" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "${ZSP_LINUX_AMD64_SHA256}  ${zsp_path}" | sha256sum --check --status
          chmod 700 "$zsp_path"

      - name: Publish signed APK to Zapstore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          if [[ "${SIGN_WITH}" != nsec1* ]]; then
            echo "Missing or invalid ZAPSTORE_NSEC environment secret" >&2
            exit 1
          fi

          "$RUNNER_TEMP/zsp" publish zapstore.yaml \
            --quiet \
            --skip-preview \
            --commit "$RELEASE_SHA"
