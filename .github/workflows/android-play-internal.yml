name: Android Play Internal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-play-internal
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAY_PACKAGE_NAME: fit.linky.app
  PLAY_TRACK: internal

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android release secrets
        uses: ./.github/actions/android-release-setup
        with:
          google-services-json-base64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          upload-store-password: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          upload-key-alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          upload-key-password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Run checks
        run: bun run check-code

      - name: Build Android App Bundle
        run: bun run native:aab:release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: apps/native-shell/android/app/build/outputs/bundle/release/app-release.aab

      - name: Prepare localized release notes
        run: |
          workspace_version="$(bun -p 'require("./package.json").version')"
          whats_new_dir="$RUNNER_TEMP/google-play-whats-new"
          apps/native-shell/scripts/extract-release-notes.sh \
            "$workspace_version" "$whats_new_dir/whatsnew-cs-CZ" cs-CZ
          apps/native-shell/scripts/extract-release-notes.sh \
            "$workspace_version" "$whats_new_dir/whatsnew-en-US" en-US

      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: apps/native-shell/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/google-play-whats-new
