name: Release · app

# Starts when CI succeeds on a push to main or a hotfix/** branch, and ships the
# commit CI tested once its version has no tag yet: `publish` creates the
# v<version> tag and GitHub release, and the web app ships by moving the
# `production` branch, which Vercel deploys to app.linky.fit. A manual run
# started from a tag republishes that tag. workflow_run jobs run in main's
# context, so every checkout names the release commit explicitly.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
      - "hotfix/**"
  workflow_dispatch:

jobs:
  resolve:
    # Pushes only: a pull request from a fork can name its branch hotfix/**.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      publish: ${{ steps.metadata.outputs.publish }}
      sha: ${{ steps.metadata.outputs.sha }}

    steps:
      # The workflow's own commit, which carries require-ci even when an older
      # hotfix commit does not.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: metadata
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            git fetch --quiet --depth 1 origin "$SHA"
            release_tag="v$(git show "$SHA:package.json" | jq -r .version)"
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
              echo "Tag $release_tag already exists; run the workflow from that tag to republish it."
              publish=false
            fi
          fi

          if [[ -z "$release_tag" || "$release_tag" == "v" ]]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          {
            echo "release_tag=$release_tag"
            echo "publish=$publish"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Require passing CI on the release commit
        if: steps.metadata.outputs.publish == 'true'
        uses: ./.github/actions/require-ci
        with:
          sha: ${{ steps.metadata.outputs.sha }}

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Every push to main starts this workflow, so only real releases queue here
    # and a no-op run can't replace a pending one.
    concurrency:
      group: release-app
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      APK_PATH: apps/native-shell/android/app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release paths
        run: |
          echo "APK_UPLOAD_PATH=$RUNNER_TEMP/linky.apk" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: apps/native-shell/scripts/extract-release-notes.sh "$RELEASE_TAG" "$RELEASE_NOTES_PATH"

      - name: Restore Android release secrets
        uses: ./.github/actions/android-release-setup
        with:
          google-services-json-base64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          upload-store-password: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          upload-key-alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          upload-key-password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Build Android release APK
        run: bun run native:apk:release

      - name: Build Android App Bundle
        working-directory: apps/native-shell/android
        run: bash ../scripts/with-java17.sh ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: apps/native-shell/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare APK asset
        run: cp "$APK_PATH" "$APK_UPLOAD_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            gh release upload "$RELEASE_TAG" "$APK_UPLOAD_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_UPLOAD_PATH" \
              --title "Linky $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --target "$RELEASE_SHA"
          fi

  web-production:
    name: Ship the web app to production
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    # Holds the release app's credentials and admits only main and v* tags.
    environment: Production
    # Releases publish one at a time, so production moves in release order.
    concurrency:
      group: web-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      # The production ruleset lets only this app push; GITHUB_TOKEN can't bypass rulesets.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          token: ${{ steps.app-token.outputs.token }}

      # Forced, because a hotfix tag cut outside main is not an ancestor of the
      # next release.
      - name: Move the production branch to the release
        run: git push --force origin HEAD:refs/heads/production

  google-play:
    name: Publish to Google Play open testing
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: android-google-play-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download signed AAB
        uses: actions/download-artifact@v8
        with:
          name: android-release-aab
          path: google-play

      - name: Prepare localized release notes
        run: |
          whats_new_dir="$RUNNER_TEMP/google-play-whats-new"
          apps/native-shell/scripts/extract-release-notes.sh \
            "$RELEASE_TAG" "$whats_new_dir/whatsnew-cs-CZ" cs-CZ
          apps/native-shell/scripts/extract-release-notes.sh \
            "$RELEASE_TAG" "$whats_new_dir/whatsnew-en-US" en-US

      - name: Upload to Google Play internal and open testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fit.linky.app
          releaseFiles: google-play/app-release.aab
          tracks: internal,beta
          status: completed
          changesNotSentForReview: false
          whatsNewDirectory: ${{ runner.temp }}/google-play-whats-new

  macos:
    name: Publish macOS beta
    needs: [resolve, publish]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the DMG
        run: bun run desktop:mac

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" apps/desktop/release/linky-mac-arm64.dmg --clobber

  zapstore:
    name: Publish to Zapstore
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zapstore
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      ZSP_VERSION: 0.4.14
      ZSP_LINUX_AMD64_SHA256: f655a6c253a0aff6c6768dd24c65fb12aafe9cd2e48d35605e623adf54aaddb2

    steps:
      - name: Checkout Zapstore metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: apps/native-shell/android/app/build/outputs/apk/release

      - name: Install verified Zapstore publisher
        run: |
          zsp_path="$RUNNER_TEMP/zsp"
          curl --fail --location --silent --show-error \
            --output "$zsp_path" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "${ZSP_LINUX_AMD64_SHA256}  ${zsp_path}" | sha256sum --check --status
          chmod 700 "$zsp_path"

      - name: Publish signed APK to Zapstore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          if [[ "${SIGN_WITH}" != nsec1* ]]; then
            echo "Missing or invalid ZAPSTORE_NSEC environment secret" >&2
            exit 1
          fi

          "$RUNNER_TEMP/zsp" publish zapstore.yaml \
            --quiet \
            --skip-preview \
            --commit "$RELEASE_SHA"
