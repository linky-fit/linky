name: Release · app

# A release normally starts from the version-bump push to main; that run creates
# the v<version> tag through `gh release create`, and tags created with the
# workflow token do not trigger workflows again. The tag trigger covers manually
# pushed tags; when such a tag already exists, the branch push skips so only one
# run publishes a given version. A manual run started from a tag republishes it,
# so every job tests and builds the commit it ships. Once the release exists, the
# web app ships by moving the `production` branch, which Vercel deploys to
# app.linky.fit.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - package.json
  workflow_dispatch:

# One release at a time, so an older release can't move `production` back.
concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      publish: ${{ steps.metadata.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: metadata
        run: |
          publish=true
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v$(jq -r .version package.json)"
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null; then
              echo "Tag $release_tag already exists; run the workflow from that tag to republish it."
              publish=false
            fi
          fi

          if [[ -z "$release_tag" || "$release_tag" == "v" ]]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    uses: ./.github/workflows/ci-checks.yml

  e2e:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    uses: ./.github/workflows/ci-e2e.yml

  publish:
    needs: [resolve, checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      APK_PATH: apps/native-shell/android/app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release paths
        run: |
          echo "APK_UPLOAD_PATH=$RUNNER_TEMP/linky.apk" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: apps/native-shell/scripts/extract-release-notes.sh "$RELEASE_TAG" "$RELEASE_NOTES_PATH"

      - name: Restore Android release secrets
        uses: ./.github/actions/android-release-setup
        with:
          google-services-json-base64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          upload-keystore-base64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          upload-store-password: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          upload-key-alias: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          upload-key-password: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}

      - name: Build Android release APK
        run: bun run native:apk:release

      - name: Build Android App Bundle
        working-directory: apps/native-shell/android
        run: bash ../scripts/with-java17.sh ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: apps/native-shell/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare APK asset
        run: cp "$APK_PATH" "$APK_UPLOAD_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_PATH"
            gh release upload "$RELEASE_TAG" "$APK_UPLOAD_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_UPLOAD_PATH" \
              --title "Linky $RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --target "$GITHUB_SHA"
          fi

  web-production:
    name: Ship the web app to production
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    # Holds the release app's credentials and admits only main and v* tags.
    environment: Production
    permissions:
      contents: read

    steps:
      # The production ruleset lets only this app push; GITHUB_TOKEN can't bypass rulesets.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.release_tag }}
          token: ${{ steps.app-token.outputs.token }}

      # Forced, because a hotfix tag cut outside main is not an ancestor of the
      # next release.
      - name: Move the production branch to the release
        run: git push --force origin HEAD:refs/heads/production

  google-play:
    name: Publish to Google Play open testing
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: android-google-play-publish
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5

      - name: Download signed AAB
        uses: actions/download-artifact@v8
        with:
          name: android-release-aab
          path: google-play

      - name: Prepare localized release notes
        run: |
          whats_new_dir="$RUNNER_TEMP/google-play-whats-new"
          apps/native-shell/scripts/extract-release-notes.sh \
            "$RELEASE_TAG" "$whats_new_dir/whatsnew-cs-CZ" cs-CZ
          apps/native-shell/scripts/extract-release-notes.sh \
            "$RELEASE_TAG" "$whats_new_dir/whatsnew-en-US" en-US

      - name: Upload to Google Play internal and open testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fit.linky.app
          releaseFiles: google-play/app-release.aab
          tracks: internal,beta
          status: completed
          changesNotSentForReview: false
          whatsNewDirectory: ${{ runner.temp }}/google-play-whats-new

  macos:
    name: Publish macOS beta
    needs: [resolve, publish]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the DMG
        run: bun run desktop:mac

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" apps/desktop/release/linky-mac-arm64.dmg --clobber

  zapstore:
    name: Publish to Zapstore
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: zapstore
    permissions:
      contents: read
    env:
      ZSP_VERSION: 0.4.14
      ZSP_LINUX_AMD64_SHA256: f655a6c253a0aff6c6768dd24c65fb12aafe9cd2e48d35605e623adf54aaddb2

    steps:
      - name: Checkout Zapstore metadata
        uses: actions/checkout@v5

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: android-release-apk
          path: apps/native-shell/android/app/build/outputs/apk/release

      - name: Install verified Zapstore publisher
        run: |
          zsp_path="$RUNNER_TEMP/zsp"
          curl --fail --location --silent --show-error \
            --output "$zsp_path" \
            "https://github.com/zapstore/zsp/releases/download/v${ZSP_VERSION}/zsp-${ZSP_VERSION}-linux-amd64"
          echo "${ZSP_LINUX_AMD64_SHA256}  ${zsp_path}" | sha256sum --check --status
          chmod 700 "$zsp_path"

      - name: Publish signed APK to Zapstore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
        run: |
          if [[ "${SIGN_WITH}" != nsec1* ]]; then
            echo "Missing or invalid ZAPSTORE_NSEC environment secret" >&2
            exit 1
          fi

          "$RUNNER_TEMP/zsp" publish zapstore.yaml \
            --quiet \
            --skip-preview \
            --commit "$GITHUB_SHA"
