name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  linkshu-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local mints
        run: docker compose -f docker-compose.dev.yml up -d --wait cashu-mint cashu-mint-target

      - name: Run linkshu integration tests
        run: bun run --filter @linky/linkshu test:integration

      - name: Dump mint logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs cashu-mint cashu-mint-target
