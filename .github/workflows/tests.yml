name: Tests

# Runs on pull requests, on every push to main (the Vercel projects released from
# main gate production on their service check) and as part of the release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  linkshu-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local mints
        run: docker compose -f docker-compose.dev.yml up -d --wait cashu-mint cashu-mint-target

      - name: Run linkshu integration tests
        run: bun run --filter @linky-fit/linkshu test:integration

      - name: Dump mint logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs cashu-mint cashu-mint-target

  service:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: site
            workspace: "@linky-fit/site"
          - check: error-tracker
            workspace: "@linky-fit/nostr-error-tracker"
          - check: push
            workspace: "@linky-fit/push"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run service tests
        uses: ./.github/actions/service-tests
        with:
          workspace: ${{ matrix.workspace }}
