name: Deploy Push Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to push.linky.fit
        uses: appleboy/ssh-action@v1
        with:
          host: push.linky.fit
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/stack
            test "$(docker compose config --images push)" = "ghcr.io/linky-fit/linky-push:latest"
            docker compose pull push
            expected_commit=$(docker image inspect ghcr.io/linky-fit/linky-push:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | cut -c1-12)
            test -n "$expected_commit"
            docker compose up -d --no-deps push
            curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 2 --retry-all-errors https://push.linky.fit/health
            actual_commit=$(curl --fail --silent --show-error --max-time 10 https://push.linky.fit/)
            test "$actual_commit" = "$expected_commit"
            echo "Deployed push commit $actual_commit"
