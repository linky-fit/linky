name: Release · npm

on:
  push:
    tags: ["packages-v*"]

permissions:
  contents: read

jobs:
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      run_id: ${{ steps.ci-run.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Require passing CI on the tagged commit
        uses: ./.github/actions/require-ci
        with:
          sha: ${{ github.sha }}
      - name: Find the CI run that built the tarballs
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  publish:
    needs: ci-passed
    runs-on: ubuntu-latest
    # Records each publish as a GitHub deployment, which the README badge shows.
    environment: npm
    strategy:
      fail-fast: false
      matrix:
        package: [linkshu, linkstr, linkauth]
    concurrency:
      group: npm-publish-${{ matrix.package }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: dist/npm
          run-id: ${{ needs.ci-passed.outputs.run_id }}
          github-token: ${{ github.token }}
      # The linkstr tarball pins linkauth at this exact version.
      - name: Wait for linkauth on npm
        if: matrix.package == 'linkstr'
        shell: bash
        run: |
          version=$(node -p "require('./packages/linkauth/package.json').version")
          for _ in $(seq 60); do
            npm view "@linky-fit/linkauth@$version" version && exit 0
            sleep 10
          done
          echo "::error::@linky-fit/linkauth@$version is not on npm"
          exit 1
      - name: Publish the tested tarball from main history
        env:
          PACKAGE: ${{ matrix.package }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/linkshu/package.json').version")
          test "$RELEASE_TAG" = "packages-v$version"
          git merge-base --is-ancestor HEAD origin/main
          npm publish "dist/npm/linky-fit-$PACKAGE-$version.tgz" --access public --ignore-scripts
