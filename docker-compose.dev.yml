# Local dev services for `bun run dev` (see apps/linky-app/.env.development).
# Run attached in a separate terminal with `bun run dev:services`.
services:
  nostr-relay:
    image: docker.io/scsibug/nostr-rs-relay:0.10.0
    # The image is published amd64-only; declare it so arm64 hosts run it under
    # emulation without the platform-mismatch warning.
    platform: linux/amd64
    ports:
      - "${LINKY_E2E_NOSTR_PORT:-7777}:8080"
    volumes:
      - nostr-relay-data:/usr/src/app/db
      - ./docker/nostr-relay/config.toml:/usr/src/app/config.toml:ro
    # Logs every query the relay drops without EOSE, so the failure dump shows it.
    environment:
      RUST_LOG: info,nostr_rs_relay::repo::sqlite=debug
    # `up --wait` must wait for the port, not the process: the app never retries
    # a relay that was unreachable at subscribe time. bash explicitly — /dev/tcp
    # is a bash builtin, the image's /bin/sh is dash, and it ships no curl/wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  evolu-relay:
    # Explicit image name so CI can `buildx bake` this service and compose
    # finds the result without rebuilding.
    image: linky-evolu-relay
    build: docker/evolu-relay
    ports:
      - "${LINKY_E2E_EVOLU_PORT:-4001}:4000"
    environment:
      EVOLU_OWNER_QUOTA_BYTES: ${EVOLU_OWNER_QUOTA_BYTES:-0}
    volumes:
      - evolu-relay-data:/app/data
    healthcheck: &evolu-relay-healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(4000,'127.0.0.1');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 25

  # Isolated relay for the Evolu quota-recovery E2E test, capped at 16 KiB of
  # encrypted history per owner. The normal :4001 relay stays unlimited.
  evolu-relay-quota:
    profiles: [e2e, quota]
    image: linky-evolu-relay
    ports:
      - "${LINKY_E2E_EVOLU_QUOTA_PORT:-4002}:4000"
    environment:
      EVOLU_OWNER_QUOTA_BYTES: "16384"
    volumes:
      - evolu-relay-quota-data:/app/data
    healthcheck: *evolu-relay-healthcheck

  cashu-mint: &cashu-mint
    image: docker.io/cashubtc/nutshell:0.20.3
    command: ["poetry", "run", "mint"]
    ports:
      - "${LINKY_E2E_MINT_PORT:-3338}:3338"
    volumes:
      - cashu-mint-data:/app/data
    environment: &cashu-mint-environment
      MINT_BACKEND_BOLT11_SAT: FakeWallet
      MINT_LISTEN_HOST: "0.0.0.0"
      MINT_LISTEN_PORT: "3338"
      MINT_PRIVATE_KEY: LOCAL_DEV_ONLY_PRIVATE_KEY
      MINT_DATABASE: data/mint
      # Nutshell's default MINT_INPUT_FEE_PPK is 100, so this mint is not
      # fee-free: every swap costs ceil(inputs / 10) sat and a receiver nets a
      # little less than the amount sent. Tests assert with that fee, keep it.
      # Test suites hit this mint in bursts; upstream defaults (60 requests
      # per minute globally, 20 per minute for transactions) reject them
      # with 429 while a real user would never come close.
      MINT_RATE_LIMIT: "FALSE"
      # Nutshell 0.20.3's limit_websocket ignores MINT_RATE_LIMIT, so NUT-17
      # subscriptions from several browsers need their own high limit.
      MINT_TRANSACTION_RATE_LIMIT_PER_MINUTE: "1000000"
      # FakeWallet simulation knobs for payment-timing tests (defaults shown).
      # FAKEWALLET_BRR: "true"                  # auto-settle created invoices
      # FAKEWALLET_DELAY_INCOMING_PAYMENT: "3"  # seconds before a top-up invoice settles
      # FAKEWALLET_DELAY_OUTGOING_PAYMENT: "3"  # seconds before melt/pay returns
      # FAKEWALLET_PAY_INVOICE_STATE: SETTLED   # or FAILED | PENDING | UNKNOWN
      # FAKEWALLET_PAYMENT_STATE: SETTLED       # poll result: SETTLED | FAILED | PENDING | UNKNOWN
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:3338/v1/info').status==200 else 1)",
        ]
      # Fine-grained polling: `up --wait` blocks until healthy, so a coarse
      # interval directly delays every stack start.
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s

  cashu-mint-target:
    <<: *cashu-mint
    profiles: ["integration", "e2e"]
    ports:
      - "${LINKY_E2E_TARGET_MINT_PORT:-3339}:3338"
    volumes:
      - cashu-mint-target-data:/app/data
    environment:
      <<: *cashu-mint-environment
      MINT_PRIVATE_KEY: LOCAL_DEV_ONLY_TARGET_MINT_KEY

  # Production build of the web app for the `local-stack` Playwright project;
  # not used by `bun run dev`. Endpoints are build args because Vite inlines
  # import.meta.env; the browser runs on the host, so these are host-published
  # ports.
  linky-app:
    profiles: ["e2e"]
    # scripts/e2e.sh tags it per checkout so worktrees never run each other's build.
    image: ${LINKY_E2E_WEB_IMAGE:-linky-app}
    build:
      context: .
      dockerfile: docker/linky-app/Dockerfile
      args:
        VITE_ALLOW_INSECURE_LOCALHOST_RELAYS: "1"
        VITE_NOSTR_RELAYS: ws://localhost:${LINKY_E2E_NOSTR_PORT:-7777}
        VITE_EVOLU_SERVER_URLS: ws://localhost:${LINKY_E2E_EVOLU_PORT:-4001}
        VITE_MAIN_MINT_URL: http://localhost:${LINKY_E2E_MINT_PORT:-3338}
        VITE_NPUB_CASH_DISABLED: "true"
        VITE_PUSH_SERVER_URL: http://localhost:8787
        # Installs window.__linkyE2E, the seed/read hooks the Playwright suites use.
        VITE_E2E: "1"
    ports:
      - "${LINKY_E2E_WEB_PORT:-5176}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s

  # Bitcoin regtest for on-chain transfers: `bun run bitcoin:up`, then drive it
  # with `bun run bitcoin -- <command>` (scripts/bitcoin-regtest.sh).
  bitcoind:
    profiles: ["bitcoin"]
    image: ghcr.io/getumbrel/docker-bitcoind:v30.0
    command:
      - -regtest
      - -server
      - -txindex
      - -fallbackfee=0.0002
      - -rpcuser=linky
      - -rpcpassword=linky
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -printtoconsole
      # Leaves initial block download right away despite the 2011 genesis.
      - -maxtipage=2000000000
    ports:
      - "18443:18443"
    volumes:
      - bitcoind-data:/data/.bitcoin
    healthcheck:
      test:
        [
          "CMD",
          "bitcoin-cli",
          "-regtest",
          "-rpcuser=linky",
          "-rpcpassword=linky",
          "getblockchaininfo",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Esplora HTTP API; the browser apps call it directly, hence CORS.
  electrs:
    profiles: ["bitcoin"]
    image: ghcr.io/vulpemventures/electrs:a808b51d0d9301fa82390b985c57551966001f9b
    command:
      - --network=regtest
      - --daemon-rpc-addr=bitcoind:18443
      - --cookie=linky:linky
      - --jsonrpc-import
      - --db-dir=/data
      - --http-addr=0.0.0.0:3002
      - --electrum-rpc-addr=0.0.0.0:60401
      - --cors=*
    depends_on:
      bitcoind:
        condition: service_healthy
    ports:
      - "3002:3002"
    volumes:
      - electrs-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/3002 && printf 'GET /blocks/tip/height HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Block explorer UI for tx links: http://localhost:3003/tx/<txid>
  esplora:
    profiles: ["bitcoin"]
    image: ghcr.io/vulpemventures/esplora:beb2cff88d63bea6991a5a9a0b11b2a45d13ee6b
    environment:
      API_URL: http://localhost:3002
    depends_on:
      electrs:
        condition: service_healthy
    ports:
      - "3003:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nostr-relay-data:
  evolu-relay-data:
  evolu-relay-quota-data:
  cashu-mint-data:
  cashu-mint-target-data:
  bitcoind-data:
  electrs-data:
