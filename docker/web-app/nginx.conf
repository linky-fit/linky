server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No SPA fallback: routing is hash-based, and an /index.html catch-all
    # would answer the dev-plugin-only /api/* endpoints with HTML and a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location = /password-save.html {
        # Internally convert the credential POST to GET for the inert document.
        error_page 405 =200 /password-save.html;
        add_header Cache-Control "no-store";
    }

    # Never serve a stale shell or WASM between test runs.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /sqlite-wasm/ {
        add_header Cache-Control "no-store";
    }
}
