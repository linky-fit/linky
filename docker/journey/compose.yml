# The journey-test services, merged over docker-compose.dev.yml by scripts/journey.sh, which sets every variable.
# Paths are relative to the repo root.
x-build-args: &build-args
  BUN_VERSION: ${LINKY_JOURNEY_BUN_VERSION}
  APPS: apps/linky-app apps/fazole-app apps/onchain-operator tools/nostr-error-tracker
  HOOKED_APPS: apps/linky-app
  GIT_COMMIT_SHA: ${LINKY_JOURNEY_HEAD_SHA}
  VITE_ALLOW_INSECURE_LOCALHOST_RELAYS: "1"
  VITE_NOSTR_RELAYS: ws://localhost:${LINKY_E2E_NOSTR_PORT}
  VITE_NOSTR_SEARCH_RELAYS: ws://localhost:${LINKY_E2E_NOSTR_PORT}
  VITE_EVOLU_SERVER_URLS: ws://localhost:${LINKY_E2E_EVOLU_PORT}
  VITE_MAIN_MINT_URL: http://localhost:${LINKY_E2E_MINT_PORT}
  VITE_NPUB_CASH_SERVER_URL: http://localhost:${LINKY_E2E_NPUBCASH_PORT}
  VITE_NPUB_CASH_UPSTREAM_URL: ""
  VITE_PUSH_SERVER_URL: http://localhost:${LINKY_JOURNEY_PUSH_PORT}
  VITE_BLOSSOM_SERVER_URL: https://localhost:${LINKY_JOURNEY_BLOSSOM_PORT}
  # The dev operator of apps/onchain-operator/README.md.
  VITE_ONCHAIN_OPERATOR_NPUB: npub1j3ntgmxzkw4rrxeh5ksrkca4tq994exjxxz2xr8dwp6xzgtjqq3s490wfg
  VITE_BITCOIN_NETWORK: regtest
  VITE_ESPLORA_URL: http://localhost:${LINKY_E2E_ESPLORA_PORT}
  VITE_EXPLORER_URL: http://localhost:${LINKY_E2E_EXPLORER_PORT}

# One image holds this checkout's four apps; `linky` builds it and the others run it.
x-app: &app
  image: ${LINKY_JOURNEY_IMAGE}:head
  pull_policy: never
  # The browsers' block list cannot see requests a preview server makes: the upload relay to Primal, and
  # the MONETA proxy of a Fazole release from before MONETA_API_ORIGIN.
  extra_hosts:
    - blossom.primal.net:127.0.0.1
    - api.moneta.cz:127.0.0.1
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  linky:
    <<: *app
    build:
      context: .
      dockerfile: docker/journey/Dockerfile
      args: *build-args
    working_dir: /app/apps/linky-app
    ports:
      - "${LINKY_JOURNEY_LINKY_PORT}:80"

  # The head with the Playwright hooks, for `bun run journey bench`; testers use `linky`.
  linky-hooked:
    <<: *app
    working_dir: /app/apps/linky-app
    command: ["./node_modules/.bin/vite", "preview", "--outDir", "dist-hooked", "--host", "0.0.0.0", "--port", "80", "--strictPort"]
    ports:
      - "${LINKY_JOURNEY_HOOKED_PORT}:80"

  fazole:
    <<: *app
    working_dir: /app/apps/fazole-app
    environment:
      MONETA_API_ORIGIN: http://bank
    ports:
      - "${LINKY_JOURNEY_FAZOLE_PORT}:80"

  operator:
    <<: *app
    working_dir: /app/apps/onchain-operator
    ports:
      - "${LINKY_JOURNEY_OPERATOR_PORT}:80"

  errors:
    <<: *app
    working_dir: /app/tools/nostr-error-tracker
    ports:
      - "${LINKY_JOURNEY_ERRORS_PORT}:80"

  # The last releases, so a finding can be tried on what users run today.
  linky-release:
    <<: *app
    image: ${LINKY_JOURNEY_IMAGE}:${LINKY_JOURNEY_LINKY_RELEASE}
    build:
      context: ${LINKY_JOURNEY_HOME}/src/${LINKY_JOURNEY_LINKY_RELEASE}
      dockerfile: ${LINKY_JOURNEY_ROOT}/docker/journey/Dockerfile
      args:
        <<: *build-args
        BUN_VERSION: ${LINKY_JOURNEY_LINKY_RELEASE_BUN_VERSION}
        APPS: apps/linky-app
        HOOKED_APPS: ""
        GIT_COMMIT_SHA: ${LINKY_JOURNEY_LINKY_RELEASE_SHA}
        # Releases up to linky-v26.11.4 accept a localhost mint only as an E2E build.
        VITE_E2E: "1"
    working_dir: /app/apps/linky-app
    ports:
      - "${LINKY_JOURNEY_LINKY_RELEASE_PORT}:80"

  fazole-release:
    <<: *app
    image: ${LINKY_JOURNEY_IMAGE}:${LINKY_JOURNEY_FAZOLE_RELEASE}
    build:
      context: ${LINKY_JOURNEY_HOME}/src/${LINKY_JOURNEY_FAZOLE_RELEASE}
      dockerfile: ${LINKY_JOURNEY_ROOT}/docker/journey/Dockerfile
      args:
        <<: *build-args
        BUN_VERSION: ${LINKY_JOURNEY_FAZOLE_RELEASE_BUN_VERSION}
        APPS: apps/fazole-app
        HOOKED_APPS: ""
        GIT_COMMIT_SHA: ${LINKY_JOURNEY_FAZOLE_RELEASE_SHA}
    working_dir: /app/apps/fazole-app
    environment:
      MONETA_API_ORIGIN: http://bank
    ports:
      - "${LINKY_JOURNEY_FAZOLE_RELEASE_PORT}:80"

  push:
    image: ${LINKY_JOURNEY_IMAGE}:push
    build:
      context: .
      dockerfile: apps/push/Dockerfile
    env_file: apps/push/.env.development
    environment:
      PUSH_STORAGE_PATH: /data/linky-push.sqlite
      PUSH_DEFAULT_RELAYS: ws://localhost:${LINKY_E2E_NOSTR_PORT}
    ports:
      - "${LINKY_JOURNEY_PUSH_PORT}:8787"
    volumes:
      - push-data:/data

  # Users' relay lists name the relay by its browser URL; this makes that URL reach it from inside push.
  push-relay-port:
    image: docker.io/alpine/socat:1.8.0.3
    network_mode: service:push
    command: TCP-LISTEN:${LINKY_E2E_NOSTR_PORT},fork,reuseaddr TCP:nostr-relay:8080

  # Photos and image messages land here instead of on Primal's public server.
  blossom:
    image: ghcr.io/hzrd149/blossom-server:6.5.0
    volumes:
      - blossom-data:/app/data

  # The apps accept only an https URL for a blob; the journey browsers ignore this proxy's self-signed certificate.
  blossom-tls:
    image: docker.io/library/caddy:2-alpine
    command: caddy reverse-proxy --from localhost:443 --to blossom:3000 --internal-certs
    ports:
      - "${LINKY_JOURNEY_BLOSSOM_PORT}:443"

  # Stands in for MONETA's business API behind Fazole's /api/moneta; `bun run journey bank pay` books a transfer.
  bank:
    image: oven/bun:1.4.4-alpine
    command: ["bun", "/fake-bank.ts"]
    volumes:
      - ./docker/journey/fake-bank.ts:/fake-bank.ts:ro
    ports:
      - "${LINKY_JOURNEY_BANK_PORT}:80"

  cashu-mint:
    environment:
      # Nutshell's default of 3 s each would sit in every measured payment and topup.
      FAKEWALLET_DELAY_OUTGOING_PAYMENT: "0"
      FAKEWALLET_DELAY_INCOMING_PAYMENT: "0"
      # "false" under `bun run journey mint hold`: invoices then stay unpaid until a wallet at this mint pays them.
      FAKEWALLET_BRR: "${LINKY_JOURNEY_MINT_SELF_PAYS}"
      # PENDING under `bun run journey mint pending`, for both the payment and every later check of it.
      FAKEWALLET_PAY_INVOICE_STATE: ${LINKY_JOURNEY_MINT_PAYS_OUT}
      FAKEWALLET_PAYMENT_STATE: ${LINKY_JOURNEY_MINT_PAYS_OUT}

  cashu-mint-target:
    environment:
      FAKEWALLET_DELAY_OUTGOING_PAYMENT: "0"
      FAKEWALLET_DELAY_INCOMING_PAYMENT: "0"

volumes:
  push-data:
  blossom-data:
