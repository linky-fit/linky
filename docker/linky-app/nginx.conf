# Keep add_header at server scope: location-level headers replace inherited ones.
map $uri $linky_cache_control {
    default "";
    /index.html "no-store";
    ~^/sqlite-wasm/ "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP meta cannot set framing restrictions; a self-host's TLS proxy must preserve these headers.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Cache-Control $linky_cache_control always;

    # No SPA fallback: routing is hash-based, and an /index.html catch-all
    # would answer the dev-plugin-only /api/* endpoints with HTML and a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's default types map serves .mjs as application/octet-stream, which
    # makes the PDF preview's module worker fail to load.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

}
