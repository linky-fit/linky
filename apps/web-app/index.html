<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- No apple-mobile-web-app-status-bar-style on purpose: on iOS 26,
         black-translucent makes the standalone web app's layout viewport
         62px short at the bottom (paint- and tap-clipped dead band under
         bottom-fixed elements). Without the meta, the viewport sits below
         the status bar and bottom-anchored UI lands on the real screen
         bottom. -->

    <title>Linky</title>
  </head>
  <body>
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          background: #020617;
          color: #f9fbfc;
          font-family:
            system-ui,
            -apple-system,
            Segoe UI,
            Roboto,
            Helvetica,
            Arial,
            sans-serif;
        "
      >
        <div style="display: grid; place-items: center; gap: 16px">
          <img
            src="/icon-animated.svg"
            alt="Linky"
            width="220"
            height="220"
            style="display: block"
          />
          <div style="font-size: 14px; opacity: 0.85">Loading…</div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const recoveryKey = "linky.boot.shell_recovery_at.v1";
        const currentDiagnosticsKey = "linky.boot.diagnostics.current.v1";
        const previousDiagnosticsKey = "linky.boot.diagnostics.previous.v1";
        const defaultWatchdogMs = 18_000;
        const retryCooldownMs = 60_000;
        const shellStartedAt = new Date().toISOString();
        const configuredWatchdogMs = Number(
          Reflect.get(window, "__linkyBootWatchdogMs"),
        );
        const watchdogMs =
          Number.isFinite(configuredWatchdogMs) && configuredWatchdogMs > 0
            ? configuredWatchdogMs
            : defaultWatchdogMs;
        let appMounted = false;

        const readLastRecoveryAt = () => {
          try {
            const value = Number(sessionStorage.getItem(recoveryKey));
            return Number.isFinite(value) ? value : 0;
          } catch {
            return 0;
          }
        };

        const markRecoveryAttempt = () => {
          try {
            const value = String(Date.now());
            sessionStorage.setItem(recoveryKey, value);
            return sessionStorage.getItem(recoveryKey) === value;
          } catch {
            return false;
          }
        };

        // Rotated here rather than in the app bundle so the previous attempt
        // survives a reload whose bundle never loads.
        const retainPreviousDiagnosticAttempt = () => {
          try {
            const current = sessionStorage.getItem(currentDiagnosticsKey);
            if (current === null) return;
            sessionStorage.setItem(previousDiagnosticsKey, current);
            sessionStorage.removeItem(currentDiagnosticsKey);
          } catch {
            // ignore storage failures
          }
        };
        retainPreviousDiagnosticAttempt();

        const readDiagnosticAttempt = (key) => {
          try {
            const stored = sessionStorage.getItem(key);
            return stored === null ? null : JSON.parse(stored);
          } catch {
            return null;
          }
        };

        const downloadBootDiagnostics = () => {
          const report = {
            collectedAt: new Date().toISOString(),
            currentAttempt: readDiagnosticAttempt(currentDiagnosticsKey),
            environment: {
              displayModeStandalone:
                typeof matchMedia === "function" &&
                matchMedia("(display-mode: standalone)").matches,
              documentVisibility: document.visibilityState,
              features: {
                broadcastChannel: typeof BroadcastChannel !== "undefined",
                cacheStorage: "caches" in window,
                indexedDb: "indexedDB" in window,
                locks: Boolean(navigator.locks),
                opfs: typeof navigator.storage?.getDirectory === "function",
                serviceWorker: "serviceWorker" in navigator,
                worker: typeof Worker !== "undefined",
              },
              language: navigator.language,
              online:
                typeof navigator.onLine === "boolean" ? navigator.onLine : null,
              page: {
                origin: location.origin,
                pathname: location.pathname,
              },
              screen: {
                devicePixelRatio,
                height: screen.height,
                viewportHeight: innerHeight,
                viewportWidth: innerWidth,
                width: screen.width,
              },
              secureContext:
                typeof isSecureContext === "boolean" ? isSecureContext : null,
              userAgent: navigator.userAgent,
            },
            previousAttempt: readDiagnosticAttempt(previousDiagnosticsKey),
            shell: {
              startedAt: shellStartedAt,
              watchdogMs,
            },
          };
          const blob = new Blob([JSON.stringify(report, null, 2)], {
            type: "application/json;charset=utf-8",
          });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = `linky-boot-diagnostics-${new Date()
            .toISOString()
            .replace(/[:.]/g, "-")}.json`;
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1_000);
        };

        const clearAppCaches = async () => {
          if ("serviceWorker" in navigator) {
            const registrations =
              await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter(
                  (registration) =>
                    new URL(registration.scope).origin === location.origin,
                )
                .map((registration) => registration.unregister()),
            );
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys
                .filter(
                  (key) => key.includes("workbox") || key.includes("linky"),
                )
                .map((key) => caches.delete(key)),
            );
          }
        };

        const recoverAndReload = async (requireRecoveryMarker = false) => {
          const recoveryWasMarked = markRecoveryAttempt();
          if (requireRecoveryMarker && !recoveryWasMarked) {
            renderBootFailure();
            return;
          }
          await Promise.race([
            clearAppCaches().catch(() => undefined),
            new Promise((resolve) => window.setTimeout(resolve, 2_500)),
          ]);
          location.reload();
        };

        const renderBootFailure = () => {
          const root = document.getElementById("root");
          if (!root) return;

          const isCzech = navigator.language.toLowerCase().startsWith("cs");
          const panel = document.createElement("div");
          panel.style.cssText =
            "min-height:100vh;display:grid;place-items:center;padding:24px;background:#020617;color:#f9fbfc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:center";

          const content = document.createElement("div");
          content.style.cssText =
            "display:grid;gap:14px;max-width:420px;justify-items:center";

          const title = document.createElement("h1");
          title.style.cssText = "font-size:20px;margin:0";
          title.textContent = isCzech
            ? "Aplikaci se nepodařilo spustit"
            : "The app failed to start";

          const description = document.createElement("p");
          description.style.cssText =
            "font-size:14px;line-height:1.5;opacity:.85;margin:0";
          description.textContent = isCzech
            ? "Načtení trvá příliš dlouho. Obnovené klíče zůstaly uložené. Před dalším pokusem si můžete stáhnout diagnostiku."
            : "Loading is taking too long. Your restored keys remain saved. You can download diagnostics before trying again.";

          const download = document.createElement("button");
          download.type = "button";
          download.style.cssText =
            "border:0;border-radius:12px;padding:12px 18px;background:#1e293b;color:#e2e8f0;font:inherit;font-weight:700;cursor:pointer";
          download.textContent = isCzech
            ? "Stáhnout diagnostiku"
            : "Download diagnostics";
          download.addEventListener("click", downloadBootDiagnostics);

          const retry = document.createElement("button");
          retry.type = "button";
          retry.style.cssText =
            "border:0;border-radius:12px;padding:12px 18px;background:#14b8a6;color:#020617;font:inherit;font-weight:700;cursor:pointer";
          retry.textContent = isCzech
            ? "Vyčistit cache a načíst znovu"
            : "Clear cache and reload";
          retry.addEventListener("click", () => {
            retry.disabled = true;
            void recoverAndReload();
          });

          content.append(title, description, download, retry);
          panel.append(content);
          root.replaceChildren(panel);
        };

        let watchdog = 0;
        const armWatchdog = () => {
          window.clearTimeout(watchdog);
          watchdog = window.setTimeout(() => {
            if (appMounted) return;

            const recoveryWasRecent =
              Date.now() - readLastRecoveryAt() < retryCooldownMs;
            if (navigator.onLine !== false && !recoveryWasRecent) {
              void recoverAndReload(true);
              return;
            }
            renderBootFailure();
          }, watchdogMs);
        };
        armWatchdog();

        // Boot may pause on an explicit user decision (temporary-session
        // consent when device storage is unavailable); don't reload from
        // under the prompt.
        window.addEventListener("linky-boot-decision-pending", () => {
          window.clearTimeout(watchdog);
        });
        window.addEventListener("linky-boot-decision-resolved", () => {
          if (!appMounted) armWatchdog();
        });

        window.addEventListener("linky-boot-failed", () => {
          window.clearTimeout(watchdog);
        });

        window.addEventListener("linky-clear-cache-and-reload", () => {
          void recoverAndReload();
        });

        window.addEventListener(
          "linky-app-mounted",
          () => {
            appMounted = true;
            window.clearTimeout(watchdog);
            try {
              sessionStorage.removeItem(recoveryKey);
            } catch {
              // ignore storage failures
            }
          },
          { once: true },
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
