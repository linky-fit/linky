<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Truhlářská dílna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1813"/><stop offset="1" stop-color="#0f0d0a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#d4a93a" stop-opacity="0.22"/><stop offset="1" stop-color="#d4a93a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <g stroke="#d4a93a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- bench -->
    <path d="M120 560 H1080"/>
    <path d="M170 560 V800 M1030 560 V800 M170 690 H1030"/>
