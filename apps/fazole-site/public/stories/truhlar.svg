    <path d="M360 500 H880 M420 530 H830" stroke-opacity="0.45" stroke-width="6"/>
    <!-- saw -->
    <path d="M520 470 L560 300 H900 L880 340 L560 340" fill="#1a1612"/>
    <path d="M600 340 l20 22 l20 -22 l20 22 l20 -22 l20 22 l20 -22 l20 22 l20 -22 l20 22 l20 -22 l20 22 l20 -22 l20 22" stroke-width="6"/>
    <path d="M900 300 q60 10 60 60 q0 40 -40 50 H880" />
    <!-- shavings -->
    <path d="M250 540 q20 -40 40 0 q20 -40 40 0" stroke-width="6" stroke-opacity="0.6"/>
    <path d="M930 545 q15 -30 30 0 q15 -30 30 0" stroke-width="6" stroke-opacity="0.6"/>
    <!-- hanging tools -->
    <path d="M200 140 V330 M160 330 H240 M200 140 l-30 -40 h60 z" stroke-width="8"/>
    <path d="M1000 140 V300 M960 300 h80 v40 h-80 z" stroke-width="8"/>
    <!-- lamp -->
    <path d="M600 60 V150 M520 150 H680 L650 220 H550 Z" stroke-width="8" fill="#2a2319"/>
  </g>
  <circle cx="600" cy="238" r="18" fill="#d4a93a" opacity="0.9"/>
