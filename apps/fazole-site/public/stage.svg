<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" aria-hidden="true">
  <style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="4 9" fill="none">
    <line x1="80" y1="690" x2="300" y2="430"/>
    <line x1="552" y1="312" x2="300" y2="430"/>
